[project]
name = "f1-analysis-service"
version = "0.1.0"
description = "Telemetry analysis microservice for F1 Engineering App - delta analysis, corner analysis, technique profiling"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scikit-learn>=1.3.0",
    "httpx>=0.26.0",  # Required for calling API service
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.26.0",
    "black>=24.1.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

# Flat layout with three top-level packages. Without this section setuptools'
# automatic discovery refuses to build ("Multiple top-level packages discovered
# in a flat-layout"), which broke `pip install -e ".[dev]"` — the CI recipe —
# for this service. `find` with include patterns (not an explicit `packages`
# list) is deliberate: the Dockerfile runs `pip install .` from a directory
# that contains only this file, where an explicit list would fail on missing
# package directories while `find` simply yields nothing.
[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "models*", "services*"]
exclude = ["tests*", "scripts*"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

